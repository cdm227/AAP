---
name: Test Local Playbook

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i my-ansible-project/inventory/hosts.ini \
            playbooks/deploy_local_playbook.yml \
            -u $USER
