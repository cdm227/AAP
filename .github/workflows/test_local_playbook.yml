name: Test Local Ansible Playbook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-playbook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i my-ansible-project/inventory/hosts.ini playbooks/deploy_local_playbook.yml -u $USER
